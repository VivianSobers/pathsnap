[project]
name = "pathsnap"
version = "0.1.0"
description = "Map-matching and route reconstruction for noisy GPS trajectories"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pathsnap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
