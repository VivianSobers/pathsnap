<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Evaluator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#667085; --line:#d9dde3; --accent:#1f6feb; --err:#b42318; --errbg:#fef3f2; --ok:#067647; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1318; --card:#181d24; --text:#e6e9ee; --muted:#98a2b3; --line:#2b323c; --accent:#58a6ff; --err:#ffb4a9; --errbg:#3a1815; --ok:#6ce9a6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  header label { color:var(--muted); }
  input[type=text] { padding:6px 8px; min-width:260px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--muted); }
  #error { display:none; margin:10px 16px 0; padding:10px 12px; border:1px solid var(--err); border-radius:6px; background:var(--errbg); color:var(--err); }
  main { flex:1; display:grid; grid-template-columns:280px 1fr 300px; gap:12px; padding:12px 16px; min-height:0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:auto; }
  .panel h2 { font-size:13px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #trips button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:10px 12px; }
  #trips button.sel { background:color-mix(in srgb, var(--accent) 15%, var(--card)); font-weight:600; }
  #trips small { color:var(--muted); display:block; }
  #map { border:1px solid var(--line); border-radius:8px; min-height:300px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:7px 12px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { padding:12px; color:var(--muted); }
  .legend { display:flex; gap:14px; padding:8px 12px; color:var(--muted); }
  .sw { display:inline-block; width:14px; height:4px; margin-right:5px; vertical-align:middle; }
  @media (max-width:900px) { main { grid-template-columns:1fr; overflow:auto; } #map { height:60vh; } }
</style>
</head>
<body>
<header>
  <h1>PathSnap Evaluator</h1>
  <label for="api">API address</label>
  <input id="api" type="text" placeholder="http://192.168.1.10:8000" spellcheck="false">
  <button id="connect" class="primary">Connect</button>
  <span id="status"></span>
</header>
<div id="error" role="alert"></div>
<main>
  <section class="panel"><h2>Evaluation trips</h2><div id="trips"><div class="empty">Connect to the API to list trips.</div></div></section>
  <div id="map"></div>
  <section class="panel">
    <h2>Scores</h2>
    <div id="scores"><div class="empty">Select a trip to run the prediction.</div></div>
    <div class="legend"><span><i class="sw" style="background:#e5484d"></i>GPS</span><span><i class="sw" style="background:#1f6feb"></i>Predicted route</span></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
// API contract (see ui/README.md):
//   GET  /trips              -> {"trips":[{"trip_id":"...", "n_points":123}, ...]}
//   POST /predict/{trip_id}  -> {"trip_id","gps":[[lat,lon],...],"route":[[[lat,lon],...],...],"scores":{name:number},"runtime_s":number}
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

const params = new URLSearchParams(location.search);
$("api").value = params.get("api") || store.get("pathsnap.api") || "http://localhost:8000";

const map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
map.setView([20, 0], 2);
const layers = L.layerGroup().addTo(map);

function base() { return $("api").value.trim().replace(/\/+$/, ""); }
function showError(msg) { const e = $("error"); e.textContent = msg; e.style.display = "block"; }
function clearError() { $("error").style.display = "none"; }

async function api(path, opts) {
  const url = base() + path;
  let res;
  try { res = await fetch(url, opts); }
  catch { throw new Error(`Cannot reach the API at ${base()}. Check that the server is running, the address and port are correct, and both laptops are on the same network (and the server allows CORS).`); }
  if (!res.ok) {
    let detail = ""; try { detail = (await res.json()).detail || ""; } catch {}
    throw new Error(`The API answered ${res.status} for ${path}${detail ? ": " + detail : ""}`);
  }
  try { return await res.json(); } catch { throw new Error(`The API at ${url} did not return JSON.`); }
}

async function connect() {
  clearError(); $("status").textContent = "Connecting…";
  store.set("pathsnap.api", $("api").value.trim());
  try {
    const data = await api("/trips");
    const list = data.trips || [];
    const box = $("trips"); box.textContent = "";
    if (!list.length) { box.innerHTML = '<div class="empty">The API returned no trips.</div>'; }
    for (const t of list) {
      const b = document.createElement("button");
      b.innerHTML = `<span></span><small></small>`;
      b.firstChild.textContent = t.trip_id;
      b.lastChild.textContent = t.n_points != null ? `${t.n_points} GPS points` : "";
      b.onclick = () => predict(t.trip_id, b);
      box.appendChild(b);
    }
    $("status").textContent = `Connected · ${list.length} trips`;
  } catch (e) { $("status").textContent = "Not connected"; showError(e.message); }
}

async function predict(id, btn) {
  clearError();
  document.querySelectorAll("#trips button").forEach(b => { b.classList.remove("sel"); b.disabled = true; });
  btn.classList.add("sel");
  $("scores").innerHTML = '<div class="empty">Running prediction…</div>';
  try {
    const r = await api("/predict/" + encodeURIComponent(id), { method: "POST" });
    draw(r); scores(r);
  } catch (e) { $("scores").innerHTML = '<div class="empty">No result.</div>'; showError(e.message); }
  finally { document.querySelectorAll("#trips button").forEach(b => b.disabled = false); }
}

function draw(r) {
  layers.clearLayers();
  const bounds = [];
  for (const p of r.gps || []) { L.circleMarker(p, { radius: 3, color: "#e5484d", weight: 1, fillOpacity: .8 }).addTo(layers); bounds.push(p); }
  for (const seg of r.route || []) { L.polyline(seg, { color: "#1f6feb", weight: 5, opacity: .8 }).addTo(layers); bounds.push(...seg); }
  if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
}

function scores(r) {
  const rows = Object.entries(r.scores || {});
  if (r.runtime_s != null) rows.push(["runtime (s)", r.runtime_s]);
  if (!rows.length) { $("scores").innerHTML = '<div class="empty">The API returned no scores.</div>'; return; }
  const t = document.createElement("table");
  for (const [k, v] of rows) {
    const tr = t.insertRow(); tr.insertCell().textContent = k.replace(/_/g, " ");
    tr.insertCell().textContent = typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(4)) : String(v);
  }
  $("scores").textContent = ""; $("scores").appendChild(t);
}

$("connect").onclick = connect;
$("api").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });
connect();
</script>
</body>
</html>
